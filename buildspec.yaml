version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 867344454629.dkr.ecr.eu-central-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo ".env fetched, size and line count:" && wc -c .env && wc -l .env
      - chmod +x scripts/docker-build-with-env.sh
      - ./scripts/docker-build-with-env.sh omaya-frontend-service
      - docker tag omaya-frontend-service:latest 867344454629.dkr.ecr.eu-central-1.amazonaws.com/omaya-frontend-service:latest     
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push 867344454629.dkr.ecr.eu-central-1.amazonaws.com/omaya-frontend-service:latest
      - printf '[{"name":"omaya-frontend","imageUri":"%s"}]' 867344454629.dkr.ecr.eu-central-1.amazonaws.com/omaya-frontend-service:latest > imagedefinitions.json

artifacts:
    files: imagedefinitions.json
