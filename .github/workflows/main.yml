name: Deploy Omaya Frontend to ECS

on:
  push:
    branches:
      - main

# Prevent two production deployments from running at the same time
concurrency:
  group: omaya-frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1

  # ECR
  ECR_REPOSITORY: omaya-frontend-service

  # ECS
  ECS_CLUSTER: omaya-prod
  ECS_SERVICE: omaya-frontend-service
  ECS_TASK_DEFINITION: omaya-production-omaya-frontend
  CONTAINER_NAME: omaya-frontend

permissions:
  contents: read

jobs:
  deploy:
    name: Build ARM64 and Deploy
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5


      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------
      # 3. Verify AWS authentication
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "Checking AWS authentication..."
          aws sts get-caller-identity


      # --------------------------------------------------
      # 4. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # 5. Configure QEMU
      #
      # GitHub runner is normally AMD64.
      # QEMU allows us to build Linux/ARM64 images.
      #
      # IMPORTANT:
      # DOCKER_DEFAULT_PLATFORM is NOT set before this step.
      # --------------------------------------------------
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64


      # --------------------------------------------------
      # 6. Build ARM64 Docker image
      # --------------------------------------------------
      - name: Build ARM64 Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Linux/ARM64 image..."

          chmod +x scripts/docker-build-with-env.sh

          # Force ARM64 ONLY during our application build
          export DOCKER_DEFAULT_PLATFORM=linux/arm64

          ./scripts/docker-build-with-env.sh \
            ${{ env.ECR_REPOSITORY }}

          echo "Tagging image with Git commit SHA..."

          docker tag \
            ${{ env.ECR_REPOSITORY }}:latest \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

          echo "Tagging image as latest..."

          docker tag \
            ${{ env.ECR_REPOSITORY }}:latest \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest


      # --------------------------------------------------
      # 7. Verify image architecture BEFORE pushing
      # --------------------------------------------------
      - name: Verify Docker image architecture
        run: |
          echo "Inspecting Docker image..."

          docker image inspect \
            ${{ env.ECR_REPOSITORY }}:latest \
            --format 'OS={{.Os}} Architecture={{.Architecture}}'

          ARCH=$(docker image inspect \
            ${{ env.ECR_REPOSITORY }}:latest \
            --format '{{.Architecture}}')

          OS=$(docker image inspect \
            ${{ env.ECR_REPOSITORY }}:latest \
            --format '{{.Os}}')

          echo "Detected OS: $OS"
          echo "Detected architecture: $ARCH"

          if [ "$OS" != "linux" ]; then
            echo "ERROR: Expected Linux image but got $OS"
            exit 1
          fi

          if [ "$ARCH" != "arm64" ]; then
            echo "ERROR: Expected ARM64 image but got $ARCH"
            exit 1
          fi

          echo "Linux/ARM64 image verified successfully."


      # --------------------------------------------------
      # 8. Push Docker images to ECR
      # --------------------------------------------------
      - name: Push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Pushing SHA-tagged image..."

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

          echo "Pushing latest image..."

          docker push \
            $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest


      # --------------------------------------------------
      # 9. Download current ECS task definition
      # --------------------------------------------------
      - name: Download current ECS task definition
        run: |
          echo "Downloading task definition..."

          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            > task-definition.json

          echo "Task definition downloaded successfully."


      # --------------------------------------------------
      # 10. Replace old image with new SHA-tagged image
      # --------------------------------------------------
      - name: Render new ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # --------------------------------------------------
      # 11. Deploy new task definition
      # --------------------------------------------------
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true


      # --------------------------------------------------
      # 12. Verify service
      # --------------------------------------------------
      - name: Verify ECS deployment
        run: |
          echo "Checking ECS service..."

          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{
              Status:status,
              Running:runningCount,
              Desired:desiredCount,
              Pending:pendingCount,
              TaskDefinition:taskDefinition
            }'


      # --------------------------------------------------
      # 13. Show useful ECS information if deployment fails
      # --------------------------------------------------
      - name: Show ECS failure details
        if: failure()
        run: |
          echo "=========================================="
          echo "Recent ECS service events"
          echo "=========================================="

          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].events[0:15].[createdAt,message]' \
            --output table

          echo ""
          echo "=========================================="
          echo "Recently stopped ECS tasks"
          echo "=========================================="

          TASKS=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --desired-status STOPPED \
            --query 'taskArns[0:5]' \
            --output text)

          if [ -n "$TASKS" ]; then
            aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks $TASKS \
              --query 'tasks[].{
                Task:taskArn,
                StopCode:stopCode,
                StoppedReason:stoppedReason,
                Containers:containers[].{
                  Name:name,
                  ExitCode:exitCode,
                  Reason:reason,
                  Image:image
                }
              }' \
              --output json
          else
            echo "No stopped tasks found."
          fi
